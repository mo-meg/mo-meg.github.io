name: Backend CI

on:
  push:
    paths: ["backend/**", "knowledge/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "knowledge/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio
      - run: docker build -t portfolio-assistant .

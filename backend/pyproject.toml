[project]
name = "portfolio-assistant"
version = "0.1.0"
description = "RAG-based portfolio assistant (FastAPI + Gemini + pgvector)"
authors = [
    { name = "mo-meg", email = "mohamed.megahed@web.de" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "google-genai>=3.4.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "BLE"]
ignore = ["S101", "S608"]  # asserts in tests; SQL built only from constant fragments

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE"]
"app/prompts.py" = ["E501"]
"app/evaluation.py" = ["E501"]
"app/cli.py" = ["ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
